services:
  api:
    build: .
    container_name: ingestion_api
    restart: unless-stopped

    dns:
      - 8.8.8.8
      - 1.1.1.1

    env_file:
      - .env

    environment:
      PYTHONPATH: /app

    ports:
      - "8000:8000"

    volumes:
      - .:/app
      - /app/.venv

    command: uvicorn src.app.app:app --host 0.0.0.0 --port 8000 --reload