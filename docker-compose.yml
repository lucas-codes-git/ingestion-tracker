services:
  db:
    image: postgres:16
    container_name: ingestion_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${dbuser}
      POSTGRES_PASSWORD: ${dbpass}
      POSTGRES_DB: ${dbname}

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${dbuser} -d ${dbname}"]
      interval: 10s
      timeout: 5s
      retries: 5


  api:
    build: .
    container_name: ingestion_api
    restart: unless-stopped
  
    depends_on:
      db:
        condition: service_healthy
  
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PYTHONPATH: /app
  
    ports:
      - "8000:8000"
  
    volumes:
      - .:/app
      - /app/.venv
  
    command: uvicorn src.app.app:app --host 0.0.0.0 --port 8000 --reload


volumes:
  pgdata: